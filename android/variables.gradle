ext {
    // minSdk 24 = Android 7.0 (2016). Capacitor 8 vereist minimaal 23; 24 dekt
    // ruim 99% van de actieve toestellen en is de Capacitor-standaard. Verhogen
    // heeft hier geen functioneel voordeel: de app is een WebView, dus de
    // ondergrens die er écht toe doet is de Chrome-versie op het toestel, en die
    // wordt los van het OS bijgewerkt via Play.
    minSdkVersion = 24
    // Google verhoogt de verplichte targetSdk jaarlijks (rond augustus). Loopt
    // die deadline af, dan weigert Play nieuwe uploads. Verhogen doe je met
    // `npx cap update android`, niet met de hand.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    androidxBiometricVersion = '1.1.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}