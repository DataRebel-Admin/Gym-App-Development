<!doctype html>
<html lang="nl-NL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | GymRebel</title>
    <!--
      Statische offline-fallback, geserveerd door public/sw.js wanneer een
      navigatie faalt.

      BEWUST ZONDER JAVASCRIPT, en bewust GEEN Next-route. De vorige fallback was
      de App Router-pagina /offline: die precachete alleen de HTML, niet haar
      JS-chunks. Offline faalden die chunks, waarna de Next-runtime de pagina
      opnieuw laadde, opnieuw de fallback kreeg en opnieuw faalde. Dat is het
      flikkeren dat gebruikers zagen. Een bestand in public/ heeft geen runtime,
      geen hydratie en geen HMR-client, dus het rendert een keer en blijft staan.

      Daarom ook: alles inline (CSS, kleuren) en als enige externe bron het
      app-icoon, dat sw.js expliciet meeprecachet. Voeg hier nooit een script of
      een extra asset toe zonder die ook in PRECACHE te zetten.

      Platformmerk, geen tenant-huisstijl: deze pagina draait zonder tenant- of
      auth-context, precies zodat 'ie altijd rendert.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #111111;
        --muted: #6b7280;
        --accent: #ff4d00;
        --accent-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #f5f5f5;
          --muted: #a3a3a3;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 600;
      }
      p {
        margin: 0.375rem auto 0;
        max-width: 24rem;
        font-size: 0.875rem;
        line-height: 1.375rem;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 0.25rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <img class="mark" src="/icons/icon-192.png" alt="GymRebel" width="64" height="64" />
    <div>
      <h1>Je bent offline</h1>
      <p>Zodra je weer online bent, kun je verdergaan met trainen.</p>
    </div>
    <a href="/">Probeer opnieuw</a>
  </body>
</html>
