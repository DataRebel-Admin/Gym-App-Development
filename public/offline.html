<!doctype html>
<html lang="nl-NL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | GymRebel</title>
    <!--
      Statische offline-fallback, geserveerd door public/sw.js wanneer een
      navigatie faalt.

      BEWUST GEEN Next-route. De vorige fallback was de App Router-pagina
      /offline: die precachete alleen de HTML, niet haar JS-chunks. Offline
      faalden die chunks, waarna de Next-runtime de pagina opnieuw laadde,
      opnieuw de fallback kreeg en opnieuw faalde. Dat is het flikkeren dat
      gebruikers zagen. Een bestand in public/ heeft geen runtime, geen hydratie
      en geen HMR-client, dus het rendert een keer en blijft staan.

      Daarom ook: alles inline (CSS, script, kleuren) en als enige externe bron
      het app-icoon, dat sw.js expliciet meeprecachet. Voeg hier nooit een
      EXTERNE asset toe zonder die ook in PRECACHE te zetten. Een inline script
      mag wel: dat laadt niets bij en kan de faalmodus hierboven dus niet
      terugbrengen (zelfde afweging als capacitor/www/error.html).

      Platformmerk, geen tenant-huisstijl: deze pagina draait zonder tenant- of
      auth-context, precies zodat 'ie altijd rendert.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #111111;
        --muted: #6b7280;
        --accent: #ff4d00;
        --accent-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #f5f5f5;
          --muted: #a3a3a3;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        /* svh, NIET dvh. `dvh` is per definitie dynamisch: hij krimpt en groeit
           mee terwijl de browserbalk op mobiel in- en uitschuift. Met
           `justify-content: center` hercentreert de hele kolom dan bij elke
           verandering, en dat is het verspringen dat je na een tik op "Probeer
           opnieuw" zag. `svh` gaat uit van de kleinste viewport (balk zichtbaar)
           en blijft dus staan. `vh` eerst als terugval voor oude browsers. */
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 600;
      }
      p {
        margin: 0.375rem auto 0;
        max-width: 24rem;
        font-size: 0.875rem;
        line-height: 1.375rem;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 0.25rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        opacity: 0.9;
      }
      /* De statusregel staat er altijd en houdt zijn ruimte bezet (visibility,
         geen display), zodat het tonen ervan niets verschuift. */
      .status {
        visibility: hidden;
        min-height: 1.375rem;
        font-size: 0.8125rem;
      }
      .status.is-visible {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <img class="mark" src="/icons/icon-192.png" alt="GymRebel" width="64" height="64" />
    <div>
      <h1>Je bent offline</h1>
      <p>Zodra je weer online bent, kun je verdergaan met trainen.</p>
    </div>
    <a id="retry" href="/">Probeer opnieuw</a>
    <p class="status" id="status" role="status">Nog steeds geen verbinding.</p>
    <script>
      // Progressieve verbetering. Zonder JS blijft de link een gewone navigatie
      // naar "/", precies zoals hiervoor.
      //
      // Mét JS: is het toestel aantoonbaar offline, dan navigeren we niet. Die
      // navigatie faalde toch en de service worker serveerde deze pagina
      // opnieuw — een volledige herlaadbeurt met flits, voor een zichtbaar
      // resultaat van nul. We tonen alleen de statusregel. `navigator.onLine`
      // is alleen betrouwbaar als hij `false` is; bij `true` proberen we het
      // gewoon, want online zijn met het netwerk is geen garantie op bereik.
      (function () {
        var link = document.getElementById("retry");
        var status = document.getElementById("status");

        link.addEventListener("click", function (event) {
          if (navigator.onLine === false) {
            event.preventDefault();
            status.classList.add("is-visible");
          }
        });

        // Komt de verbinding terug, ga dan meteen verder (zelfde gedrag als de
        // native foutpagina in capacitor/www/error.html).
        window.addEventListener("online", function () {
          window.location.replace(link.href);
        });
      })();
    </script>
  </body>
</html>
